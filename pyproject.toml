[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prototyping"
version = "0.1.0"
description = "AI-assisted rapid prototyping for MBSE: SysML v2 generation, bilevel DSE, multi-fidelity verification"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
